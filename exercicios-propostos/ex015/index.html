<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador de Idade</title>
  <style>

    body{
      background-color: #151515;
      color: rgba(255, 255, 255, .80);
      font-family: Arial, sans-serif;
    }
    header {
      text-align: center;
    }
    section{
      background-color: #3179FF;
      border-radius: 10px;
      padding: 14px;
      width: 500px;
      margin: auto;
      text-align: center;
    }

    img#foto {
      width: 250px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      font-style: italic;
    }
    
  </style>
</head>
<body>
  <header>

    <h1>Verificador de Idade</h1>

  </header>

  <Section>

    <div>

      <p>Ano de nascimento:
        <input type="number" name="txtano" id="txtano" min="0">
      </p>

      <p>Sexo: 
        <input type="radio" name="radsex" id="masc" checked>
        <label for="masc">Masculino</label>
        <input type="radio" name="radsex" id="fem">
        <label for="fem">Feminino</label>
      </p>

      <p>
        <input type="button" value="verificar" onclick="verificar()">
      </p>
    </div>

    <div id="paiRes">
      <p id="res">Preencha os dados acima para ver o resultado!</p>
    </div>

  </Section>

  <footer>

    <p>&#169; Curso em Vídeo</p>
  </footer>

  
  <script>

    function verificar() {

      var data = new Date()
      var ano = data.getFullYear()
      var fano = document.getElementById('txtano')
      var res = document.getElementById('res')
      var paiRes = document.getElementById('paiRes')
      if (fano.value.length == 0 || fano.value > ano) {
        window.alert('Digita direito zé ruela')
      } else {
        var fsex = document.getElementsByName('radsex')
        var idade = ano - Number(fano.value)
        res.innerHTML = `Idade calculada: ${idade}`
        var gen = ''

        var img = document.createElement('img')
        img.setAttribute('id', 'foto')

        if (fsex[0].checked) {
          gen = 'Homem'

          if (idade >= 0 && idade < 10) {
            // criança
            img.setAttribute('src', 'kid-m.png')
          } else if (idade < 21) {
            // jovem
            img.setAttribute('src', 'jovem-m.png')
          } else if (idade < 50) {
            // adulto
            img.setAttribute('src', 'adulto-m.png')
          } else {
            // idoso
            img.setAttribute('src', 'idoso.png')
          }

        } else {
          gen = 'Mulher'

          if (idade >= 0 && idade < 10) {
            // criança
            img.setAttribute('src', 'kid-f.png')
          } else if (idade < 21) {
            // jovem
            img.setAttribute('src', 'jovem-f.png')
          } else if (idade < 50) {
            // adulto
            img.setAttribute('src', 'adulto-f.png')
          } else {
            // idoso
            img.setAttribute('src', 'idosa.png')
          }

        }
        res.innerHTML = `Você é <strong>${gen}</strong> com ${idade} anos.`
        paiRes.appendChild(img)
      }

    }

  </script>
</body>
</html>
